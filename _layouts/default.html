<!DOCTYPE html>
<html lang="{{ page.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
    <div class="container">
        <div class="sidebar" role="complementary">
            <div id="language-switch" role="navigation" aria-label="Language">
                <a href="{{ '/es/' | relative_url }}" lang="es">Español</a> |
                <a href="{{ '/en/' | relative_url }}" lang="en">English</a>
            </div>
            <div id="avatar">
                <img src="{{ '/assets/avatar.jpg' | relative_url }}" alt="{% if page.lang == 'es' %}Foto de perfil{% else %}Profile picture{% endif %}" width="100" height="100">
            </div>
            <div class="sidebar-content">
                {{ page.sidebar | markdownify }}
            </div>
        </div>
        <div class="content" role="main">
            {{ content }}
        </div>
        <div class="footer">
            {% if page.lang == 'es' %}
            Sitio creado con Jekyll y GitHub Pages.
            {% else %}
            Built with Jekyll and GitHub Pages.
            {% endif %}
        </div>
    </div>
</body>
</html>
