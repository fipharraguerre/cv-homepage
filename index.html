<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Auto-redirect based on browser language
        var userLang = navigator.language || navigator.userLanguage || "";
        var englishPage = "{{ '/en/' | relative_url }}";
        var spanishPage = "{{ '/es/' | relative_url }}";
        if (userLang.toLowerCase().indexOf("es") === 0) {
            window.location.href = spanishPage;
        } else {
            window.location.href = englishPage;
        }
    </script>
</head>
<body>
    <p>Choose a language / Elegí un idioma:</p>
    <ul>
        <li><a href="{{ '/en/' | relative_url }}" lang="en">English</a></li>
        <li><a href="{{ '/es/' | relative_url }}" lang="es">Español</a></li>
    </ul>
</body>
</html>
